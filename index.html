<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LS239 측정값 수신기</title>
<style>
  :root{
    --shell:#1b2430;
    --shell-deep:#121923;
    --lcd:#a8d5c4;
    --lcd-ink:#16241d;
    --edge:#2e3d4e;
    --ink:#dce5ee;
    --ink-dim:#7e91a6;
    --live:#5ad1a0;
    --warn:#e0a04a;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    padding:16px 14px 40px;
    background:var(--shell-deep);
    color:var(--ink);
    font-family:"Helvetica Neue",-apple-system,"Segoe UI",Roboto,sans-serif;
    -webkit-text-size-adjust:100%;
  }
  h1{
    font-size:15px;
    font-weight:600;
    letter-spacing:.02em;
    margin:0 0 14px;
    color:var(--ink-dim);
  }

  /* 계기판 */
  .panel{
    background:var(--lcd);
    border-radius:10px;
    padding:18px 18px 12px;
    color:var(--lcd-ink);
    box-shadow:inset 0 2px 6px rgba(0,0,0,.25);
  }
  .reading{
    display:flex;
    align-items:baseline;
    justify-content:flex-end;
    gap:8px;
    font-variant-numeric:tabular-nums;
  }
  .reading b{
    font-size:76px;
    font-weight:700;
    line-height:.9;
    letter-spacing:-.02em;
  }
  .reading span{font-size:20px;font-weight:600}
  .meta{
    display:flex;
    justify-content:space-between;
    margin-top:12px;
    padding-top:8px;
    border-top:1px solid rgba(22,36,29,.35);
    font-size:13px;
    font-weight:600;
  }

  /* 연결 */
  .bar{display:flex;gap:8px;margin:14px 0}
  button{
    flex:1;
    font:inherit;
    font-weight:600;
    font-size:15px;
    padding:14px;
    border-radius:8px;
    border:1px solid var(--edge);
    background:var(--shell);
    color:var(--ink);
    cursor:pointer;
  }
  button:focus-visible{outline:2px solid var(--live);outline-offset:2px}
  button:disabled{opacity:.4;cursor:default}
  button.primary{background:var(--live);border-color:var(--live);color:#08221a}

  .status{
    font-size:13px;
    color:var(--ink-dim);
    margin:0 0 14px;
    min-height:1.4em;
  }
  .status.on{color:var(--live)}
  .status.err{color:var(--warn)}

  /* 기록 */
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{
    text-align:left;
    font-weight:600;
    color:var(--ink-dim);
    padding:8px 6px;
    border-bottom:1px solid var(--edge);
    font-size:12px;
  }
  td{
    padding:9px 6px;
    border-bottom:1px solid rgba(46,61,78,.5);
    vertical-align:top;
  }
  td.num{font-variant-numeric:tabular-nums;font-weight:700;font-size:15px;white-space:nowrap}
  td.hex{
    font-family:"SF Mono",Menlo,Consolas,monospace;
    font-size:10.5px;
    color:var(--ink-dim);
    word-break:break-all;
    line-height:1.5;
  }
  .empty{
    padding:28px 6px;
    color:var(--ink-dim);
    font-size:13px;
    text-align:center;
  }
  .note{
    margin-top:22px;
    padding-top:14px;
    border-top:1px solid var(--edge);
    font-size:12px;
    line-height:1.7;
    color:var(--ink-dim);
  }
  code{font-family:"SF Mono",Menlo,Consolas,monospace;color:var(--ink)}
</style>
</head>
<body>

<h1>LS239 측정값 수신기</h1>

<div class="panel">
  <div class="reading"><b id="val">---</b><span>㎛</span></div>
  <div class="meta">
    <span id="mat">대기</span>
    <span id="count">0건</span>
  </div>
</div>

<div class="bar">
  <button id="connect" class="primary">측정기 연결</button>
  <button id="csv" disabled>CSV 저장</button>
</div>
<p class="status" id="status">연결 버튼을 누르고 목록에서 CT로 시작하는 기기를 선택하세요.</p>

<table>
  <thead><tr><th>시각</th><th>값</th><th>재질</th><th>원본 패킷</th></tr></thead>
  <tbody id="rows"><tr><td colspan="4" class="empty">측정을 시작하면 여기에 쌓입니다</td></tr></tbody>
</table>

<p class="note">
패킷 구조: <code>AB 44</code>로 시작하는 15바이트.
9~10번째 바이트를 리틀엔디안 16비트로 읽어 10으로 나눈 값이 두께,
13번째 바이트가 재질 코드(1=Fe, 2=Al, 3=FeZn)입니다.
기기 화면이 <code>Non-Metal</code>일 때는 패킷을 보내지 않으므로 이 화면도 갱신되지 않습니다.
</p>

<script>
const SERVICE = 0xFFE0, CHAR = 0xFFE1;
const rows = [];
const $ = id => document.getElementById(id);

const MAT = {1:'Fe', 2:'Al', 3:'FeZn'};

function setStatus(msg, cls){
  $('status').textContent = msg;
  $('status').className = 'status' + (cls ? ' ' + cls : '');
}

function hex(bytes){
  return [...bytes].map(b => b.toString(16).padStart(2,'0').toUpperCase()).join(' ');
}

function parse(dv, bytes){
  if (bytes.length < 15 || bytes[0] !== 0xAB) return null;
  return {
    um: Math.floor(dv.getUint16(8, true) / 10),  // 기기 LCD는 소수점을 버림
    raw10: dv.getUint16(8, true),
    matCode: bytes[12]
  };
}

function render(){
  const tb = $('rows');
  if (!rows.length){
    tb.innerHTML = '<tr><td colspan="4" class="empty">측정을 시작하면 여기에 쌓입니다</td></tr>';
    return;
  }
  tb.innerHTML = rows.map(r => `<tr>
    <td>${r.time}</td>
    <td class="num">${r.um === null ? '—' : r.um}</td>
    <td>${r.mat}</td>
    <td class="hex">${r.raw}</td>
  </tr>`).join('');
}

function onPacket(e){
  const dv = e.target.value;
  const bytes = new Uint8Array(dv.buffer);
  const raw = hex(bytes);
  const p = parse(dv, bytes);
  const time = new Date().toLocaleTimeString('ko-KR', {hour12:false});

  if (p){
    const mat = MAT[p.matCode] || ('코드 ' + p.matCode);
    $('val').textContent = p.um;
    $('mat').textContent = mat;
    rows.unshift({time, um: p.um, mat, raw});
  } else {
    rows.unshift({time, um: null, mat: '해석 불가', raw});
  }

  $('count').textContent = rows.length + '건';
  $('csv').disabled = false;
  render();
}

const sleep = ms => new Promise(r => setTimeout(r, ms));

async function hook(dev, attempt){
  // 직전 연결이 남아 있으면 정리
  if (dev.gatt.connected) dev.gatt.disconnect();
  await sleep(300 * attempt);

  const server = await dev.gatt.connect();
  await sleep(500);                     // 서비스 탐색 전 안정화 대기
  const svc = await server.getPrimaryService(SERVICE);
  const ch = await svc.getCharacteristic(CHAR);
  await ch.startNotifications();
  ch.addEventListener('characteristicvaluechanged', onPacket);
}

$('connect').onclick = async () => {
  if (!navigator.bluetooth){
    setStatus('이 브라우저는 웹 블루투스를 지원하지 않습니다. 안드로이드 크롬에서 열어주세요.', 'err');
    return;
  }

  let dev;
  try {
    setStatus('기기를 찾는 중…');
    dev = await navigator.bluetooth.requestDevice({
      filters: [{services:[SERVICE]}],
      optionalServices: [SERVICE]
    });
  } catch (err){
    setStatus('기기를 선택하지 않았습니다.', 'err');
    return;
  }

  dev.addEventListener('gattserverdisconnected', () => {
    setStatus('연결이 끊겼습니다. 다시 연결하세요.', 'err');
    $('connect').disabled = false;
  });

  for (let attempt = 1; attempt <= 4; attempt++){
    try {
      setStatus('연결 중… (' + attempt + '/4)');
      await hook(dev, attempt);
      $('connect').disabled = true;
      setStatus(dev.name + ' 연결됨. 이제 측정하세요.', 'on');
      return;
    } catch (err){
      if (attempt === 4){
        setStatus('연결 실패: ' + err.message + ' — 폰 블루투스를 껐다 켜고 다시 시도하세요.', 'err');
      } else {
        await sleep(800);
      }
    }
  }
};

$('csv').onclick = () => {
  const lines = ['시각,두께(um),재질,원본패킷'];
  [...rows].reverse().forEach(r => {
    lines.push([r.time, r.um ?? '', r.mat, '"' + r.raw + '"'].join(','));
  });
  const blob = new Blob(['\ufeff' + lines.join('\n')], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'ls239-' + Date.now() + '.csv';
  a.click();
  URL.revokeObjectURL(a.href);
};
</script>
</body>
</html>
